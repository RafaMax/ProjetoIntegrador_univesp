<form class="c-form"
      {% if evaluation %}
      action="{{ url_for('evaluation.update_evaluation', evaluation_id=evaluation.id) }}"
      {% else %}
      action="{{ url_for('evaluation.insert_evaluation') }}"
      {% endif %}

      method="{% if evaluation %}PUT{% else %}POST{% endif %}"

      {% if evaluation %}
      c-swap="#evaluation-{{evaluation.id}}"
      {% else %}
      c-append="#evaluations_list"
      {% endif %}

      c-reload-container="true">

    <div class="mb-3">
        <label class="form-label">Id da compra</label>
        <input type="number" class="form-control" name="buy_id" {% if evaluation %}value="{{evaluation.buy_id}}" {%
               endif %}>
    </div>

    <!--<div class="mb-3">
        <label class="form-label">Classificação</label>
        <input type="text" class="form-control" name="ranking" {% if evaluation %}value="{{evaluation.ranking}}" {% endif %}>
    </div>-->

    <div>
        <label class="form-check-label">Classificação</label>
        <br>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="ranking" value="A" {% if evaluation and
                   evaluation.ranking=="A" %} checked {% endif %} checked>
            <label class="form-check-label">A</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="ranking" value="B" {% if evaluation and
                   evaluation.ranking=="B" %} checked {% endif %}>
            <label class="form-check-label">B</label>
        </div>
        <div class="form-check form-check-inline">
            <input class="form-check-input" type="radio" name="ranking" value="C" {% if evaluation and
                   evaluation.ranking=="C" %} checked {% endif %}>
            <label class="form-check-label">C</label>
        </div>
    </div>

    <br>


    <button type="submit" class="btn btn-dark mt-3 mb-2">
        {% if evaluation %}Salvar{% else %}Criar{% endif %}
    </button>
</form>
