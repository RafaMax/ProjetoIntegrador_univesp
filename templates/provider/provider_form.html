<form class="c-form"
        {% if provider %}
            action="{{ url_for('provider.update_provider', provider_id=provider.id) }}"
        {% else %}
            action="{{ url_for('provider.insert_provider') }}"
        {% endif %}

        method="{% if provider %}PUT{% else %}POST{% endif %}"

        {% if provider %}
            c-swap="#provider-{{provider.id}}"
        {% else %}
            c-append="#providers_list"
        {% endif %}

        c-reload-container="true">

    <div class="mb-3">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" name="name" {% if provider %}value="{{provider.name}}"{% endif %}>
    </div>

    
    <button type="submit" class="btn btn-dark mt-3 mb-2">
        {% if provider %}Salvar{% else %}Criar{% endif %}
    </button>
</form>
