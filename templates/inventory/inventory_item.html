<tr id="inventory-{{inventory.id}}">
    <th scope="row">{{ inventory.id }}</th>
    <td>{{ inventory.product_id }}</td>
    <td>
        <button class="btn btn-primary"
            c-get="{{ url_for('inventory.inventory_edit_form', inventory_id=inventory.id) }}"
            c-target="#inventory-form">
                Editar
        </button>

        <button class="btn btn-danger"
            c-delete="{{ url_for('inventory.delete_inventory', inventory_id=inventory.id) }}"
            c-target="#inventory-form"
            c-remove-closest="tr">
                Deletar
        </button>
    </td>
</tr>
