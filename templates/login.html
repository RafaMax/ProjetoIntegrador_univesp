<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Supermercado Eva</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
    </head>
    <body>
        <body class="bg-light mt-5 py-5 d-flex align-items-center justify-content-center">
            <div class="card shadow-lg w-100" style="max-width: 480px;">
                <div class="card-body">
                    <div class="text-center">
                        <h1 class="card-title h3">Login</h1>
                        <p class="card-text text-muted">Faça login abaixo para acessar sua conta</p>
                    </div>
                    <div class="mt-4">
                        <form action="">
                            <div class="mb-4">
                                <label for="email" class="form-label text-muted">Email</label>
                                <input type="email" class="form-control" id="email" placeholder="Endereço de e-mail" required>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label text-muted">Senha</label>
                                <input type="password" class="form-control" id="password" placeholder="Senha" required>
                            </div>
                            <div class="d-grid">
                                <a class="btn btn-dark btn-lg" href="{{url_for('home.home')}}" role="button">
                                    Entrar
                                </a>
                            </div>
                            <p class="text-center text-muted mt-4">Ainda não tem uma conta?
                                <a href="#!" class="text-decoration-none">Cadastre-se</a>.
                            </p>
                        </form>
                    </div>
                </div>
            </div>
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
            <script src="{{ url_for('static', filename='js/cru.js')  }}"></script>
        </body>
    </body>
</html>
