<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"/>
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet"/>
    <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet"/>
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <title>Document</title>
</head>

<body>
    <div class="card mb-4">
        <div class="card-body">
            <table>
                <div class="container">
                    <h1 class="text-center">Gestão de produtos</h1>

                    <div id="product-form" c-container=" {{url_for('product.product_form')}}"></div>

                    <hr>

                    <h2>Lista de produtos</h2>

                    <div c-container="{{url_for('product.products_list')}}">

                </div>
            </table>
        
            <table>
                <div class="container">
                    <h1 class="text-center">Gestão do estoque</h1>

                    <div id="inventory-form" c-container=" {{url_for('inventory.inventory_form')}}"></div>

                    <hr>

                    <h2>Lista de estoques</h2>

                    <div c-container="{{url_for('inventory.inventories_list')}}"></div>
                </div>
            </table>
            <table>
                <div class="container">
                    <h1 class="text-center">Gestão de compras</h1>

                    <div id="buy-form" c-container=" {{url_for('buy.buy_form')}}"></div>

                    <hr>

                    <h2>Lista de compras</h2>

                    <div c-container="{{url_for('buy.buys_list')}}"></div>

                </div>
            </table>
            <table>
                <div class="container">
                    <h1 class="text-center">Gestão de fornecedores</h1>

                    <div id="provider-form" c-container=" {{url_for('provider.provider_form')}}"></div>

                    <hr>

                    <h2>Lista de fornecedores</h2>

                    <div c-container="{{url_for('provider.providers_list')}}"></div>

                </div>
            </table>
            <table>
                <div class="container">
                    <h1 class="text-center">Gestão de avaliação</h1>

                    <div id="evaluation-form" c-container=" {{url_for('evaluation.evaluation_form')}}"></div>

                    <hr>

                    <h2>Lista de avaliações</h2>

                    <div c-container="{{url_for('evaluation.evaluations_list')}}"></div>

                </div>
            </table>
        </div>
    </div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="{{ url_for('static',filename='js/scripts.js') }}"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
<script src="{{ url_for('static',filename='assets/demo/chart-area-demo.js') }}"></script>
<script src="{{ url_for('static',filename='assets/demo/chart-bar-demo.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
        crossorigin="anonymous"></script>
<script src="{{ url_for('static',filename='js/datatables-simple-demo.js') }}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/cru.js')  }}"></script>
</body>

</html>
