<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>UNIVESP PI</title>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename= 'js/style.css') }}">
    </head>

    <body>
        <div class="wrapper">
            <aside id="sidebar">
                <div class="d-flex justify-content-between p-4">
                    <div class="sidebar-logo">
                        <a href="#">Navegação</a>
                    </div>
                    <button class="toggle-btn border-0" type="button">
                        <i id="icon" class='bx bx-chevron-right-square'></i>
                    </button>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link">
                            <i class='bx bxs-layer' ></i>
                            <span>Task</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse"
                            data-bs-target="#user" aria-expanded="false" aria-controls="user">
                            <i class='bx bxs-user-account'></i>
                            <span>User</span>
                        </a>
                        <ul id="user" class="sidebar-dropdown list-unstyled collapse" data-bs-parent= "#sidebar">
                            <li class="sidebar-item">
                                <a href="#" class="sidebar-link">
                                    Login
                                </a>
                            </li>
                            <li class="sidebar-item">
                                <a href="#" class="sidebar-link">
                                    Register
                                </a>
                            </li>
                        </ul>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse" data-bs-target="#multi" aria-expanded="false" aria-controls="multi">
                            <i class='bx bxs-bar-chart-alt-2' ></i>
                            <span>Multi Level</span>
                        </a>
                        <ul id="multi" class="sidebar-dropdown list-unstyled collapse" data-bs-parent="#sidebar">
                            <li class="sidebar-item">
                                <a href="#" class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse"
                                    data-bs-target="#multi-two" aria-expanded="false" aria-controls="multi-two">
                                    <span>Two Links</span>
                                </a>
                                <ul id="multi-two" class="sidebar-dropdown list-unstyled collapse">
                                    <li class="sidebar-item">
                                        <a href="#" class="sidebar-link">Link 1</a>
                                    </li>
                                    <li class="sidebar-item">
                                        <a href="#" class="sidebar-link">Link 2</a>
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link">
                            <i class='bx bxs-report'></i>
                            <span>Categoria X</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link">
                            <i class='bx bxs-notepad'></i>
                            <span>Categoria Y</span>
                        </a>
                    </li>
                </ul>
                <div class="sidebar-footer">
                    <a href="" class="sidebar-link">
                        <i class='bx bx-log-out'></i>
                        <span>Logout</span>
                    </a>
                </div>
            </aside>
            <div class="main">
                <nav class="navbar navbar-expand px-4 py-2">
                 <div class="mb-0 px-1 py-3">
                    <h1> SUPERMERCADO EVA </h1>
                 </div>                
                </nav>
                <main class="content px-3 py-4">
                    <div class="container-fluid">
                        <div class="mb-3">
                            <h3 class="fw-bold fs-4 mb-3">
                                Painel do Administrador
                            </h3>
                            <div class="row">
                                <div class="col-12 col-md-4">
                                    <div class="card shadow">
                                        <div class="card-body py-4">
                                            <h6 class="mb-2 fw-bold">
                                               Linha 1 
                                            </h6>
                                            <p class="fw-bold mb-2">
                                                Linha 2
                                            </p>
                                            <div class="mb-0">
                                                <span class="badge text-success me-2">
                                                    Linha 3
                                                </span>
                                                <span class="fw-bold">
                                                    Linha 4
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-12 col-md-4">
                                    <div class="card shadow">
                                        <div class="card-body py-4">
                                            <h6 class="mb-2 fw-bold">
                                               Linha 5 
                                            </h6>
                                            <p class="fw-bold mb-2">
                                                Linha 6
                                            </p>
                                            <div class="mb-0">
                                                <span class="badge text-success me-2">
                                                    Linha 7
                                                </span>
                                                <span class="fw-bold">
                                                    Linha 8
                                                </span>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
        <script src="{{ url_for('static', filename='js/script.js')  }}"></script>
    </body>
</html>
