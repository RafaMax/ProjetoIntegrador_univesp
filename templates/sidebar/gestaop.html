<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Supermercado Eva</title>
        <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
        <link rel="stylesheet" href="{{ url_for('static', filename= 'css/style.css') }}">
    </head>

    <body>
        <div class="wrapper">
            <aside id="sidebar">
                <div class="d-flex justify-content-between p-4">
                    <div class="sidebar-logo">
                        <a href="#">Navegação</a>
                    </div>
                    <button class="toggle-btn border-0" type="button">
                        <i id="icon" class='bx bx-chevron-right-square'></i>
                    </button>
                </div>
                <ul class="sidebar-nav">
                    <li class="sidebar-item">
                        <a href="{{url_for('home.home')}}" class="sidebar-link">
                            <i class='bx bxs-layer' ></i>
                            <span>Painel</span>
                        </a>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse"
                            data-bs-target="#avaliacao" aria-expanded="false" aria-controls="avaliacao">
                            <i class='bx bxs-report'></i>
                            <span>Avaliações</span>
                        </a>
                        <ul id="avaliacao" class="sidebar-dropdown list-unstyled collapse" data-bs-parent= "#sidebar">
                            <li class="sidebar-item">
                                <a class="sidebar-link" href="{{url_for('avaliacao.avaliacao')}}">
                                    Avaliar produto
                                </a>
                        </ul>
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse"
                            data-bs-target="#produtos" aria-expanded="false" aria-controls="produtos">
                            <i class='bx bxs-notepad'></i>
                            <span>Produtos</span>
                        </a>
                        <ul id="produtos" class="sidebar-dropdown list-unstyled collapse" data-bs-parent= "#sidebar">
                            <li class="sidebar-item">
                                <a class="sidebar-link" href="{{url_for('produtos.gestaop')}}">
                                    Editar produto
                                </a>
                        </ul>
                        
                    </li>
                    <li class="sidebar-item">
                        <a href="#" class="sidebar-link collapsed has-dropdown" data-bs-toggle="collapse"
                            data-bs-target="#fornecedores" aria-expanded="false" aria-controls="fornecedores">
                            <i class='bx bxs-user-account'></i>
                            <span>Fornecedores</span>
                        </a>
                        <ul id="fornecedores" class="sidebar-dropdown list-unstyled collapse" data-bs-parent= "#sidebar">
                            <li class="sidebar-item">
                                <a class="sidebar-link" href="{{url_for('fornecedores.gestaof')}}">
                                    Editar fornecedor
                                </a>
                        </ul>
                    </li>
                </ul>
                <div class="sidebar-footer">
                    <a href="{{url_for('login.login')}}" class="sidebar-link">
                        <i class='bx bx-log-out'></i>
                        <span>Logout</span>
                    </a>
                </div>
            </aside>
            <div class="main">
                <nav class="navbar navbar-expand px-4 py-2">
                 <div class="mb-0">
                    <h1> SUPERMERCADO EVA </h1>
                 </div>                
                </nav>
                <main class="content px-3 py-4">
                    <div class="container-fluid">
                        <div class="mb-3">
                            <h3 class="fw-bold fs-4 mb-3">
                                Gestão de produtos
                            </h3>
                            <div class="container py-5">
                                <div class="card mb-4">
                                    <div class="card-body">
                                        <div class="container">
                                            <h1 class="text-center">
                                                Adicionar produtos
                                            </h1>
                                            <div id="product-form" c-container=" {{url_for('product.product_form')}}"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card mb-4">
                                    <table class="table table-striped table-hover">
                                        <h1 class="text-center">
                                            Lista de produtos
                                        </h1>
                                        <div c-container="{{url_for('product.products_list') }}"></div>
                                    </table>
                                </div>
                                    
                                <div class="card mb-4">
                                    <div class="card-body">
                                        <div class="container">
                                            <h1 class="text-center">
                                                Gestão do estoque
                                            </h1>
                                            <div id="inventory-form" c-container=" {{url_for('inventory.inventory_form')}}"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card mb-4">
                                    <table class="table table-striped table-hover">
                                        <h1 class="text-center">
                                            Lista de estoques
                                        </h1>
                                        <div c-container="{{url_for('inventory.inventories_list')}}"></div>
                                    </table>
                                </div>

                                <div class="card mb-4">
                                    <div class="card-body">
                                        <div class="container">
                                            <h1 class="text-center">
                                                Gestão de compras
                                            </h1>
                                            <div id="buy-form" c-container=" {{url_for('buy.buy_form')}}"></div>
                                        </div>
                                    </div>
                                </div>
                                <div class="card mb-4">
                                    <table class="table table-striped table-hover">
                                        <h1 class="text-center">
                                            Lista de compras
                                        </h1>
                                        <div c-container="{{url_for('buy.buys_list')}}"></div>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
        <script src="{{ url_for('static', filename='js/script.js')  }}"></script>
        <script src="{{ url_for('static', filename='js/cru.js')  }}"></script>

        <script src="{{ url_for('static',filename='assets/demo/chart-area-demo.js') }}"></script>
        <script src="{{ url_for('static',filename='assets/demo/chart-bar-demo.js') }}"></script>

        <script src="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/umd/simple-datatables.min.js"
                crossorigin="anonymous"></script>
        <script src="{{ url_for('static',filename='js/datatables-simple-demo.js') }}"></script>
            
    </body>
</html>
